# Builds the PC app for Linux, Windows and macOS. The IPS patches and map assets live in the Lemuroid fork submodule.
name: pc
on:
  workflow_dispatch:
  push:
    tags: ['v*']
jobs:
  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { submodules: recursive }
      - run: sudo apt-get update && sudo apt-get install -y libsdl2-dev python3-pil
      - run: ./build-pc.sh
      - uses: actions/upload-artifact@v4
        with: { name: smz3-linux, path: build/pc/smz3 }
  windows:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { submodules: recursive }
      - run: sudo apt-get update && sudo apt-get install -y gcc-mingw-w64-x86-64 g++-mingw-w64-x86-64 python3-pil
      - run: ./build-pc.sh windows
      - uses: actions/upload-artifact@v4
        with: { name: smz3-windows, path: build/win/smz3.exe }
  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with: { submodules: recursive }
      - run: brew install sdl2 && pip3 install pillow --break-system-packages
      - run: ./build-pc.sh
      - uses: actions/upload-artifact@v4
        with: { name: smz3-macos, path: build/pc/smz3 }
